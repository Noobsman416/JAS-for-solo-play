<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Just A Scratch! ソロテストプレイ</title><style>
:root{--bg:#f4f1ea;--fg:#1b1530;--pn:#fff;--bd:#c9c3b6;--a:#ffb3b3;--k:#a8e890;--s:#c3a3e8;--ac:#b34a00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141f;--fg:#ece8f5;--pn:#241f30;--bd:#4a4360;--a:#8a3d46;--k:#3f7a35;--s:#6b4e9a;--ac:#ffa45c}}
:root[data-theme="dark"]{--bg:#17141f;--fg:#ece8f5;--pn:#241f30;--bd:#4a4360;--a:#8a3d46;--k:#3f7a35;--s:#6b4e9a;--ac:#ffa45c}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans JP','Hiragino Sans',sans-serif;font-size:16px;line-height:1.5}
#app{max-width:1000px;margin:0 auto;padding:12px}h1{font-size:20px;margin:4px 0}.m{color:var(--ac);font-size:14px}
.pn{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;margin:8px 0}
.hp{display:inline-block;border:1px solid var(--bd);border-radius:6px;padding:0 8px;margin:4px 4px 0 0;font-size:13px}.hp.u{border-color:var(--ac);color:var(--ac)}.hp.x{opacity:.45;text-decoration:line-through}
#log{height:210px;overflow-y:auto;background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:14px;margin:8px 0}
.pr{font-weight:700;margin:8px 0 4px}
button{font:inherit;color:var(--fg);border:1px solid var(--bd);background:var(--pn);border-radius:8px;padding:6px 14px;cursor:pointer}

.acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.acts button,.go{font-weight:700;border-color:var(--ac)}.er{color:var(--ac);font-size:14px}
select{font:inherit}

.bd{position:relative;width:100%;aspect-ratio:3/2;background:var(--mat) center/100% 100%;border-radius:10px;overflow:hidden}
.sl{position:absolute;display:flex;align-items:center;justify-content:center}.sl .cd{height:94%}.sl.up .cd{outline:2px solid #ffb35c}
.cd{display:inline-block;aspect-ratio:179/252;background-size:100% 100%;border-radius:4px;box-shadow:0 1px 4px #0009;flex:none}
.lt{color:#fffa;font-size:clamp(9px,1.7vw,14px);text-decoration:line-through}
.fc{position:absolute;left:24%;width:52%;height:15%;display:flex;justify-content:center;gap:1%}.fc .cd{height:100%}
.hand{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-height:136px}.hc{cursor:pointer;transition:transform .1s}.hc .cd{height:128px}.hc.on{transform:translateY(-8px)}.hc.on .cd{outline:3px solid var(--ac)}
.ib{font-size:13px;margin:6px 0}.bk{margin-left:8px;display:inline-flex;gap:2px;vertical-align:middle}.bk .cd{height:30px}
#log{height:150px}
.lay{display:flex;gap:12px;align-items:flex-start}.bdw{flex:1;min-width:0}.sd{width:210px;flex:none;position:sticky;top:8px}
.sc{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;margin-bottom:8px;font-size:13px;line-height:1.5}.sc b{font-size:15px}.dm{color:var(--ac);font-weight:700}.sp{opacity:.85}
@media (max-width:760px){.lay{flex-direction:column}.sd{width:100%;order:-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;position:static}.sc{margin:0}}

 let h=`<div class="lay"><div class="bdw"><div class="m">ターン${G.t}${G.turnInfo?' ・攻撃側: '+G.turnInfo.A.name:''}</div>${bar(cp,1)}<div class="bd">${hpRow(cp,1)}${hpRow(me,0)}${fieldH(1)}${fieldH(0)}</div>${bar(me,0)}`;
 if(U)h+=`<div class="pr">${esc(U.msg)}</div>`;
 h+=`<div class="hand">${me.hand.map((c,i)=>`<div class="hc${U&&U.sel.has(i)?' on':''}"${U?` data-i="${i}"`:''}>${cd(c)}</div>`).join('')}</div>`;
 if(U)h+=`<div class="acts">${U.btns.map(b=>`<button data-a="${b[0]}">${b[1]}</button>`).join('')}</div><div class="er">${esc(U.err||'')}</div>`;
 else if(fin)h+=`<button class="go" data-a="again">もう一度</button>`;
 h+=`<div id="log">${L.slice(-60).map(esc).join('<br>')}</div>`;
 h+=`</div><div class="sd">${side(cp)}${side(me)}</div></div>`;app.innerHTML=h;const lg=$('#log');if(lg)lg.scrollTop=lg.scrollHeight}
function human(c){return new Promise(res=>{const p=c.p;U={sel:new Set(),err:'',msg:'',btns:[]};
 const done=v=>{U=null;render();res(v)},I=()=>[...U.sel].sort((a,b)=>a-b),op=G.P.find(q=>q!=p);
 const chk=a=>{const x={k:a,i:a=='pass'?[]:I()};if(a=='shove'&&!x.i.length){const j=p.hand.indexOf(J.SH);if(j>=0)x.i=[j]}
  if(J.legal(p,{role:c.role=='free'?'x':c.role,n:c.n,G},x))done(x);else{U.err='その選び方はできません(攻撃・反撃は同じ種類、キックはキック、押しのけは押しのけ1枚)';render()}};
 if(c.role=='myo'){U.msg='ミョルニル: 手札を1枚捨てるとスピード2。捨てるカードを押す';U.btns=[['no','使わない']];U.pick=i=>done(i);U.on=()=>done(-1)}
 else if(c.role=='dual'){U.msg='二刀流で戦いますか?(ダメージ2倍・スピード半減)';U.btns=[['y','はい'],['n','いいえ']];U.on=a=>done(a=='y')}
 else if(c.role=='swap'){U.msg=`反撃の種類か枚数が合っていません。手札の「${c.type}」を${c.n}枚以上選んで出し直せます(1枚多いごとにダメージ+1)`;U.btns=[['ok','出し直す']];U.on=()=>{const i=I();if(i.length>=c.n&&i.every(j=>p.hand[j]==c.type))done({k:'swap',i});else{U.err=`「${c.type}」を${c.n}枚以上選んでください`;render()}}}
 else if(c.role=='dis'){U.msg='ターン終了。捨てたい手札を選んで「確定」(選ばなければそのまま補充)';U.btns=[['ok','確定']];U.on=()=>done(I())}
 else if(c.role=='free'){U.msg='キック成功! 対処できない攻撃を1回。攻撃カードを選ぶ';U.btns=[['attack','攻撃'],['skip','やめる']];U.on=a=>a=='skip'?done({k:'skip'}):chk(a)}
 else{const att=c.role=='att',r=c.n+(J.W(p).h==1&&p.sh=='なし'?1:0);
  U.msg=att?`あなたが攻撃側(行動${c.n+1}回目)。伏せるカードを選んで、行動を決める`:`相手は${c.n}枚を伏せた。${c.kn?`(相手の攻撃は${c.kn.type}×${c.kn.n}と公開済み。キックは意味がないので選べません)`:''}ガードに必要な枚数: ${r}枚${p.hand.length<r?'(手札が足りず、ガードは失敗します)':'(出す枚数が足りないと不足分+1枚を捨て、払えないと失敗)'}。カードを選んで行動を決める`;
  U.btns=[[att?'attack':'counter',att?'攻撃':'反撃']];if(!c.kn)U.btns.push(['kick','キック']);if(J.canG(p,op))U.btns.push(['guard','ガード']);U.btns.push(['shove','押しのけ']);if(att&&c.n>=1)U.btns.push(['pass','パス']);U.on=chk}
 render()})}
const cpuAg=async c=>{await new Promise(r=>setTimeout(r,450));return (LV?J.cpuR:J.cpu)(c)};
function start(){const v=s=>$(s).value;LV=+v('#lv');let w2=v('#w2');if(w2=='random')w2=WN[J.rnd(WN.length)];
 let sh2='なし',du2=false;const s2=v('#s2');if(J.WP[w2].h==1){if(s2=='auto'){if(Math.random()<.65)sh2=['小盾','中盾','大盾'][J.rnd(3)];else du2=Math.random()<.5}else if(s2=='dual')du2=true;else sh2=s2}
 const P=[J.mkP('あなた',v('#w1'),v('#s1'),$('#d1').checked,human),J.mkP('CPU',w2,sh2,du2,cpuAg)];
 L=[];fin=0;G=J.mkG(P,m=>{L.push(m);render()});G.dm=v('#dm');G.dbg=$('#dbg').checked;L.push(`CPUの装備: ${WD[w2]||w2}${sh2!='なし'?' + '+sh2:''}${du2?'(二刀流)':''}`);G.sl=ms=>new Promise(r=>setTimeout(r,ms));G.rd=render;render();
 J.play(G).then(w=>{L.push(w?`★ ${w.name}の勝利!`:'引き分け(150ターンを超えた)');fin=1;G.field=[null,null];render()})}
app.onclick=e=>{const t=e.target.closest('[data-i],[data-a]');if(!t)return;
 if(t.dataset.a=='go')return start();if(t.dataset.a=='again'){G=null;fin=0;return render()}
 if(!U)return;if(t.dataset.i!=null){const i=+t.dataset.i;if(U.pick)return U.pick(i);U.sel.has(i)?U.sel.delete(i):U.sel.add(i);U.err='';render()}else U.on(t.dataset.a)};
render();
</script></body></html>
